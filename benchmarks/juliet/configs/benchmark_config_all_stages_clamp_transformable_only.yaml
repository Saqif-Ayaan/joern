# All-stages (A/B/C) clamp-transformable-only subset config.

juliet_root: /Users/saqif/Downloads/C

tools:
  joern: ./joern
  joern_parse: ./joern-parse
  run_script: benchmarks/juliet/scripts/run_bof_workflow.sc

paths:
  manifests_root: benchmarks/juliet/manifests/curated_allstage_clamp_transformable_only
  staged_root: benchmarks/juliet/outputs/staged
  cache_root: benchmarks/juliet/outputs/cache
  findings_root: benchmarks/juliet/outputs/findings
  logs_root: benchmarks/juliet/outputs/logs
  score_root: benchmarks/juliet/outputs/scored
  summary_root: benchmarks/juliet/outputs/summary

options:
  force: false
  parallelism: 1

stages:
  - A
  - B
  - C

configs:
  clamp_subset_master:
    alias: clamp_transformable_only_all_stages
    modeled_policy: ENFORCE
    discovery_enabled: false
    flow_mode: int_array_index_clamp_io
    input_root: benchmarks/juliet/outputs/curated/all_stages/clamp_transformable_only
